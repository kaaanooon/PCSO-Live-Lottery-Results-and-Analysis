<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philippine Lottery Statistical Analysis</title>
  <style>
    :root {
      --navy: #102a43; --blue: #1677a8; --teal: #0f8b8d; --gold: #f4b942;
      --ink: #243b53; --muted: #627d98; --line: #d9e2ec; --paper: #ffffff;
      --wash: #f4f8fb; --danger: #9b2c2c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--wash); }
    header { color: white; background: linear-gradient(125deg, var(--navy), #0b7285); padding: 28px 34px 24px; }
    header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .2px; }
    header p { margin: 4px 0; color: #d9f2f2; max-width: 1000px; }
    .warning { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.12); border-left: 4px solid var(--gold); }
    nav { display: flex; gap: 7px; overflow-x: auto; padding: 12px 24px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 4; }
    nav button { white-space: nowrap; border: 1px solid var(--line); border-radius: 18px; padding: 7px 13px; background: white; color: var(--navy); cursor: pointer; font-weight: 600; }
    nav button.active { color: white; background: var(--blue); border-color: var(--blue); }
    main { max-width: 1500px; margin: 0 auto; padding: 24px; }
    .title-row { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 14px; }
    h2 { color: var(--navy); margin: 0; font-size: 24px; }
    h3 { color: var(--navy); margin: 0 0 12px; font-size: 17px; }
    .subtle { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(6, minmax(135px, 1fr)); gap: 10px; margin: 12px 0 18px; }
    .card, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 2px 8px rgba(16,42,67,.05); }
    .card { padding: 13px 14px; }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .card .value { color: var(--navy); font-size: 21px; font-weight: 700; margin-top: 3px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .panel { padding: 16px; overflow: hidden; }
    .panel.full { margin-bottom: 14px; }
    .chart { width: 100%; min-height: 310px; overflow-x: auto; }
    svg { width: 100%; min-width: 680px; height: auto; display: block; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
    .table-wrap { overflow: auto; max-height: 490px; border: 1px solid var(--line); border-radius: 7px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: white; }
    th { position: sticky; top: 0; background: #e8f1f7; color: var(--navy); text-align: left; z-index: 1; }
    th, td { padding: 7px 9px; border-bottom: 1px solid #edf2f7; white-space: nowrap; }
    tbody tr:nth-child(even) { background: #f8fbfd; }
    .candidate-note { color: var(--danger); font-size: 12px; font-weight: 600; margin: 0 0 10px; }
    .heat-cell { text-align: center; min-width: 42px; }
    .method { margin-top: 16px; color: var(--muted); }
    .method a { color: var(--blue); }
    code { background: #edf2f7; color: var(--navy); padding: 2px 5px; border-radius: 4px; }
    footer { padding: 20px 24px 35px; text-align: center; color: var(--muted); }
    @media (max-width: 1050px) { .cards { grid-template-columns: repeat(3, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { header { padding: 22px 18px; } main { padding: 14px; } .cards { grid-template-columns: repeat(2, 1fr); } }
    @media print { nav { display: none; } body { background: white; } .panel, .card { box-shadow: none; break-inside: avoid; } }
  </style>
</head>

    function renderGame(code) {
      const game = gameByCode(code), s = game.summary;
      document.querySelectorAll("nav button").forEach(button => button.classList.toggle("active", button.dataset.code === code));
      const frequencyColumns = [
        {key:"number",label:"Number"}, {key:"appearance_count",label:"Appearances"},
        {key:"appearance_share_pct",label:"Share",format:pct}, {key:"draw_hit_rate_pct",label:"Draw hit rate",format:pct},
        {key:"expected_count",label:"Expected"}, {key:"difference_from_expected",label:"Δ expected"},
        {key:"z_score",label:"Z-score"}, {key:"draws_since_last",label:"Draws since last"},
        {key:"mean_gap_draws",label:"Mean gap"}, {key:"maximum_gap_draws",label:"Max gap"},
        {key:"last_seen",label:"Last seen"}, {key:"frequency_rank",label:"Rank"}
      ];
      const candidateColumns = [
        {key:"rank",label:"#"}, {key:"strategy",label:"Strategy"}, {key:"combination",label:"Combination"},
        {key:"even_count",label:"Even"}, {key:"odd_count",label:"Odd"}, {key:"low_count",label:"Low"},
        {key:"high_count",label:"High"}, {key:"sum",label:"Sum"}, {key:"historical_fit_score",label:"Historical fit"},
        {key:"seen_before_count",label:"Seen before"}
      ];
      if (game.rule.rambolito_name) candidateColumns.push(
        {key:"rambolito_key",label:`${game.rule.rambolito_name} key`},
        {key:"straight_permutations",label:"Straight permutations"}
      );
      candidateColumns.push({key:"theoretical_odds_1_in",label:"Same odds: 1 in",format:fmt.format});
      const timeText = game.draw_time_breakdown.map(row => `${row.draw_time}: ${fmt.format(row.draw_count)}`).join(" · ");
      const pairLabel = game.rule.ordered ? "Adjacent Ordered Transitions" : "Most Frequent Unordered Pairs";
      const pairColumns = [{key:"pair_or_transition",label:game.rule.ordered?"Transition":"Pair"},{key:"count",label:"Occurrences"},{key:"draw_support_pct",label:"Occurrence rate",format:pct}];
      const rambolito = game.rambolito_frequency.length ? `<div class="panel"><h3>${esc(game.rule.rambolito_name)} Group Frequency</h3><p class="subtle">Canonical sorted multiset; separate from Standard exact-order analysis.</p>${table(game.rambolito_frequency,[{key:"rambolito_key",label:"Canonical key"},{key:"straight_permutations",label:"Permutations"},{key:"draw_count",label:"Observed draws"},{key:"first_seen",label:"First seen"},{key:"last_seen",label:"Last seen"}])}</div>` : "";
      document.getElementById("content").innerHTML = `
        <div class="title-row"><div><h2>${esc(game.rule.name)}</h2><div class="subtle">${esc(s.rule)} ${game.rule.rambolito_name ? `${game.rule.rambolito_name} is analyzed separately.` : ""}</div></div><div class="subtle">Observed slots: ${esc(timeText)}</div></div>
        <div class="cards">
          <div class="card"><div class="label">Draws analyzed</div><div class="value">${fmt.format(s.draw_count)}</div></div>
          <div class="card"><div class="label">Actual coverage</div><div class="value" style="font-size:15px">${s.selected_start_date}<br>${s.selected_end_date}</div></div>
          <div class="card"><div class="label">Even observations</div><div class="value">${pct(s.even_occurrence_pct)}</div></div>
          <div class="card"><div class="label">Odd observations</div><div class="value">${pct(s.odd_occurrence_pct)}</div></div>
          <div class="card"><div class="label">Average draw sum</div><div class="value">${s.average_draw_sum}</div></div>
          <div class="card"><div class="label">One exact outcome</div><div class="value" style="font-size:16px">${s.theoretical_odds}</div></div>
        </div>
        <div class="grid-2"><div class="panel"><h3>Number Frequency</h3>${frequencyChart(game)}</div><div class="panel"><h3>Even/Odd Mix per Draw</h3>${parityChart(game)}</div></div>
        <div class="panel full"><h3>Draw Sequence Scatter</h3><p class="subtle">Each point is a drawn value. For jackpot games, colors show machine draw sequence only—not ticket order.</p>${scatterChart(game)}</div>
        <div class="panel full"><h3>Historically Profiled Candidates</h3><p class="candidate-note">These are reproducible samples, not predictions. The historical-fit score is descriptive and does not change the equal theoretical odds.</p>${table(game.candidates,candidateColumns)}</div>
        ${heatmap(game)}
        <div class="grid-2"><div class="panel"><h3>Full Number Frequency and Gaps</h3>${table(game.frequency,frequencyColumns)}</div><div class="panel"><h3>${pairLabel}</h3>${table(game.pair_or_transition_frequency,pairColumns)}</div></div>
        ${rambolito}
        <div class="panel full method"><h3>Method and Sources</h3><p>Period is inclusive. Frequencies, parity, gaps, scatter points, transitions/pairs, and candidate profiles use only the selected input records. Candidate seed: <code>${s.candidate_seed}</code>. Rebuild another period with <code>lottery-analysis --from YYYY-MM-DD --to YYYY-MM-DD</code>.</p><p>${esc(REPORT.metadata.coverage_warning)}</p>${REPORT.metadata.sources.map(source => `<p><a href="${esc(source.url)}" target="_blank" rel="noreferrer">${esc(source.name)}</a></p>`).join("")}</div>`;
      window.scrollTo({top:0, behavior:"smooth"});
    }

    document.getElementById("period").textContent = `Requested period: ${REPORT.metadata.requested_start_date} to ${REPORT.metadata.requested_end_date} · ${fmt.format(REPORT.metadata.draw_count)} records · ${fmt.format(REPORT.metadata.number_observations)} number observations`;
    document.getElementById("warning").textContent = REPORT.metadata.candidate_disclaimer + " " + REPORT.metadata.coverage_warning;
    const nav = document.getElementById("game-nav");
    REPORT.games.filter(game => game.summary.draw_count).forEach(game => {
      const button = document.createElement("button"); button.dataset.code = game.rule.code; button.textContent = game.rule.name; button.onclick = () => renderGame(game.rule.code); nav.appendChild(button);
    });
    const requestedGame = new URLSearchParams(window.location.search).get("game");
    const initialGame = REPORT.games.find(game => game.rule.code === requestedGame && game.summary.draw_count)
      || REPORT.games.find(game => game.summary.draw_count);
    renderGame(initialGame.rule.code);
  </script>
</body>
</html>
